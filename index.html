<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habits — Build the streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet" />
<style>
  /* ── TOKENS ─────────────────────────────────── */
  :root {
    --bg:        #0e0e10;
    --surface:   #17171a;
    --border:    #2a2a30;
    --accent:    #c8f135;       /* electric lime */
    --accent2:   #4fffb0;       /* mint pop */
    --muted:     #44444e;
    --text:      #e8e8ec;
    --text-dim:  #888896;
    --today-bg:  rgba(200,241,53,.07);
    --radius:    12px;
    --font:      'Syne', sans-serif;
    --mono:      'Syne Mono', monospace;
    --ease:      cubic-bezier(.22,1,.36,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 80px;
    overflow-x: hidden;
  }

  /* ── HEADER ─────────────────────────────────── */
  header {
    width: 100%;
    max-width: 900px;
    padding: 36px 0 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -.03em;
    color: var(--accent);
    line-height: 1;
    flex-shrink: 0;
  }

  .logo span { color: var(--text); }

  .tagline {
    font-size: .75rem;
    color: var(--text-dim);
    letter-spacing: .12em;
    text-transform: uppercase;
    font-family: var(--mono);
  }

  /* ── MAIN CONTENT ────────────────────────────── */
  main { width: 100%; max-width: 900px; }

  /* ── WEEK NAV ────────────────────────────────── */
  .week-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .week-label {
    font-size: .8rem;
    font-family: var(--mono);
    color: var(--text-dim);
    letter-spacing: .06em;
    flex: 1;
  }

  .btn-nav {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: .8rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }

  .btn-nav:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-nav:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-today {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e10;
    font-weight: 700;
  }

  .btn-today:hover {
    background: #d9ff4a;
    border-color: #d9ff4a;
    color: #0e0e10;
  }

  /* ── ADD HABIT ───────────────────────────────── */
  .add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  .add-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: .9rem;
    padding: 11px 16px;
    outline: none;
    transition: border-color .15s;
  }

  .add-row input::placeholder { color: var(--muted); }

  .add-row input:focus {
    border-color: var(--accent);
  }

  .btn-add {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #0e0e10;
    font-family: var(--font);
    font-size: 1.2rem;
    font-weight: 800;
    padding: 11px 20px;
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
    line-height: 1;
  }

  .btn-add:hover { background: #d9ff4a; transform: scale(1.04); }
  .btn-add:active { transform: scale(.97); }
  .btn-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ── GRID ────────────────────────────────────── */
  .grid-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .grid {
    min-width: 560px;
    display: grid;
    /* habit name + 7 days + streak */
    grid-template-columns: minmax(140px, 1.8fr) repeat(7, 1fr) auto;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ── COLUMN HEADERS ─────────────────────────── */
  .col-header {
    background: var(--surface);
    padding: 12px 4px 10px;
    text-align: center;
    font-size: .68rem;
    font-family: var(--mono);
    color: var(--text-dim);
    letter-spacing: .08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    position: relative;
    user-select: none;
  }

  .col-header.habit-col {
    text-align: left;
    padding-left: 16px;
    font-size: .7rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: .1em;
  }

  .col-header.streak-col {
    font-size: .65rem;
    padding: 12px 12px 10px;
    text-align: right;
  }

  .col-header.today-col {
    background: var(--today-bg);
    color: var(--accent);
  }

  .col-header.today-col::after {
    content: '';
    display: block;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    margin: 4px auto 0;
  }

  .day-num {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
  }

  .today-col .day-num { color: var(--accent); }

  /* ── HABIT ROWS ──────────────────────────────── */
  .habit-row {
    display: contents;
  }

  .habit-row:last-of-type .cell { border-bottom: none !important; }

  .cell {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    transition: background .12s;
  }

  .cell:focus-within { background: rgba(255,255,255,.02); }

  .cell.today-col { background: var(--today-bg); }

  /* habit name cell */
  .cell.name-cell {
    justify-content: flex-start;
    padding: 8px 12px 8px 16px;
    gap: 8px;
    border-right: 1px solid var(--border);
  }

  .habit-name-text {
    font-size: .88rem;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .habit-name-input {
    font-family: var(--font);
    font-size: .88rem;
    font-weight: 600;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--accent);
    color: var(--text);
    outline: none;
    width: 100%;
    padding: 1px 0;
  }

  .btn-delete {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .15s, color .15s;
    flex-shrink: 0;
  }

  .cell.name-cell:hover .btn-delete,
  .cell.name-cell:focus-within .btn-delete {
    opacity: 1;
  }

  .btn-delete:hover { color: #ff5555; }
  .btn-delete:focus-visible { outline: 2px solid #ff5555; outline-offset: 1px; opacity: 1; }

  /* check cells */
  .check-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .18s var(--ease);
    position: relative;
    flex-shrink: 0;
    color: transparent;
  }

  .check-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .22s var(--ease);
  }

  .check-btn:hover {
    border-color: var(--accent);
    background: rgba(200,241,53,.08);
    color: var(--accent);
    transform: scale(1.1);
  }

  .check-btn.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e10;
    transform: scale(1);
  }

  .check-btn.checked svg {
    stroke-dashoffset: 0;
  }

  .check-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* pop animation when checked */
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.28); }
    70%  { transform: scale(.92); }
    100% { transform: scale(1); }
  }

  .check-btn.pop { animation: pop .3s var(--ease); }

  /* disabled future days */
  .check-btn.disabled {
    opacity: .3;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* streak cell */
  .cell.streak-cell {
    justify-content: flex-end;
    padding-right: 14px;
    border-left: 1px solid var(--border);
    min-width: 64px;
  }

  .streak-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: .82rem;
    font-weight: 600;
    color: var(--text-dim);
  }

  .streak-badge .fire { font-size: .9rem; }

  .streak-badge.hot {
    color: var(--accent);
  }

  .streak-badge.blazing {
    color: #ff9c3a;
  }

  /* ── EMPTY STATE ─────────────────────────────── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 80px 20px;
    text-align: center;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    animation: fadeIn .4s var(--ease);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .empty-icon {
    font-size: 3rem;
    line-height: 1;
    filter: grayscale(.3);
  }

  .empty-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  .empty-sub {
    font-size: .85rem;
    color: var(--text-dim);
    max-width: 300px;
    line-height: 1.6;
  }

  /* ── ROW ENTER ANIMATION ────────────────────── */
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .habit-row-animate .cell {
    animation: rowIn .28s var(--ease);
  }

  /* ── FUTURE WEEK NOTICE ──────────────────────── */
  .future-notice {
    font-size: .78rem;
    font-family: var(--mono);
    color: var(--text-dim);
    text-align: center;
    margin-top: 16px;
    letter-spacing: .04em;
  }

  /* ── RESPONSIVE ──────────────────────────────── */
  @media (max-width: 600px) {
    header { padding: 24px 0 16px; }
    .logo  { font-size: 1.2rem; }
    .tagline { display: none; }
    .grid  { min-width: 480px; }
    .cell  { min-height: 46px; }
    .col-header { padding: 10px 2px 8px; font-size: .6rem; }
    .day-num { font-size: .88rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">habits<span>.</span></div>
  <div class="tagline">track / streak / repeat</div>
</header>

<main>
  <!-- Week navigation -->
  <div class="week-nav">
    <button class="btn-nav" id="btn-prev" aria-label="Previous week">← prev</button>
    <button class="btn-nav btn-today" id="btn-today" aria-label="Go to current week">this week</button>
    <button class="btn-nav" id="btn-next" aria-label="Next week">next →</button>
    <span class="week-label" id="week-label" aria-live="polite"></span>
  </div>

  <!-- Add habit -->
  <div class="add-row">
    <input
      type="text"
      id="new-habit-input"
      placeholder="Add a habit… e.g. Read 30 min"
      maxlength="60"
      aria-label="New habit name"
    />
    <button class="btn-add" id="btn-add" aria-label="Add habit">+</button>
  </div>

  <!-- Grid container -->
  <div class="grid-wrap" id="grid-container" role="region" aria-label="Habit tracker grid"></div>
</main>

<script>
/* ── CONSTANTS ───────────────────────────────── */
const STORAGE_KEY = 'habits_v1';
const DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK_STARTS_MONDAY = true; // Monday start — see ANSWERS.md

/* ── HELPERS ─────────────────────────────────── */
function toISO(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function parseISO(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function todayISO() { return toISO(new Date()); }

/** Get Monday of the week containing date */
function getMondayOf(date) {
  const d = new Date(date);
  const dow = d.getDay(); // 0=Sun…6=Sat
  const diff = WEEK_STARTS_MONDAY ? (dow === 0 ? -6 : 1 - dow) : -dow;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

/** Return 7 ISO date strings for the week starting at weekStart */
function weekDates(weekStart) {
  return Array.from({length:7}, (_,i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return toISO(d);
  });
}

function isFutureDate(iso) { return iso > todayISO(); }

/* ── STATE ───────────────────────────────────── */
let state = {
  habits: [],   // [{id, name, createdAt}]
  checks: {}    // {ISO_date: {habitId: bool}}
};

let currentWeekStart = getMondayOf(new Date());

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ── STREAK ──────────────────────────────────── */
/**
 * Current streak = consecutive days ending today (if today checked)
 * or ending yesterday (if today not yet checked). That way you don't
 * lose your streak the moment you wake up — see ANSWERS.md.
 */
function calcStreak(habitId) {
  const today = todayISO();
  const todayChecked = state.checks[today]?.[habitId];
  let cursor = new Date(todayChecked ? today : (() => {
    const y = new Date(); y.setDate(y.getDate()-1); return toISO(y);
  })());

  // Walk back while habit was created & checked
  let streak = 0;
  while (true) {
    const iso = toISO(cursor);
    const habit = state.habits.find(h => h.id === habitId);
    if (!habit || iso < habit.createdAt) break;
    if (!state.checks[iso]?.[habitId]) break;
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// render pass polished
  /* ── RENDER ──────────────────────────────────── */
function render(animateNew = false) {
  const container = document.getElementById('grid-container');
  const today     = todayISO();
  const dates     = weekDates(currentWeekStart);
  const isFuture  = dates[0] > today;

  // Week label
  const fmt = {month:'short', day:'numeric'};
  const s   = parseISO(dates[0]);
  const e   = parseISO(dates[6]);
  document.getElementById('week-label').textContent =
    `${s.toLocaleDateString('en-US',fmt)} – ${e.toLocaleDateString('en-US',{...fmt, year:'numeric'})}`;

  // Today btn visibility
  const isCurrentWeek = dates.includes(today);
  document.getElementById('btn-today').style.opacity = isCurrentWeek ? '.4' : '1';
  document.getElementById('btn-today').style.pointerEvents = isCurrentWeek ? 'none' : '';

  /* ── EMPTY STATE ── */
  if (state.habits.length === 0) {
    container.innerHTML = `
      <div class="empty-state" role="status" aria-label="No habits yet">
        <div class="empty-icon" aria-hidden="true">🌱</div>
        <div class="empty-title">No habits yet</div>
        <div class="empty-sub">Type a habit above and press + to start building your first streak.</div>
      </div>`;
    return;
  }

  /* ── BUILD GRID ── */
  const dayHeaders = dates.map((iso, i) => {
    const d = parseISO(iso);
    const isToday = iso === today;
    const dayName = DAY_NAMES[d.getDay()];
    const dayNum  = d.getDate();
    return `
      <div class="col-header${isToday ? ' today-col' : ''}" aria-label="${dayName} ${dayNum}${isToday ? ', today' : ''}">
        ${dayName}<span class="day-num">${dayNum}</span>
      </div>`;
  }).join('');

  const rows = state.habits.map((habit, idx) => {
    const streak = calcStreak(habit.id);
    const streakClass = streak >= 14 ? 'blazing' : streak >= 3 ? 'hot' : '';
    const streakIcon  = streak >= 14 ? '🔥' : streak >= 3 ? '✦' : '';
    const streakLabel = streak >= 3 ? `${streak}` : streak > 0 ? `${streak}d` : '–';

    const checkCells = dates.map(iso => {
      const checked  = !!state.checks[iso]?.[habit.id];
      const future   = isFutureDate(iso);
      const isToday  = iso === today;
      const label    = `${checked ? 'Uncheck' : 'Check'} ${habit.name} for ${iso}`;
      return `
        <div class="cell${isToday ? ' today-col' : ''}" role="gridcell">
          <button
            class="check-btn${checked ? ' checked' : ''}${future ? ' disabled' : ''}"
            data-habit="${habit.id}"
            data-date="${iso}"
            aria-label="${label}"
            aria-pressed="${checked}"
            ${future ? 'disabled aria-disabled="true"' : ''}
            tabindex="0"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <polyline points="2.5,8.5 6.5,12.5 13.5,4.5"/>
            </svg>
          </button>
        </div>`;
    }).join('');

    return `
      <div class="habit-row${animateNew && idx === 0 ? ' habit-row-animate' : ''}" role="row" data-habitid="${habit.id}">
        <div class="cell name-cell" role="rowheader">
          <span class="habit-name-text" title="${habit.name}" tabindex="0" role="button" aria-label="Rename ${habit.name}">${habit.name}</span>
          <button class="btn-delete" data-habit="${habit.id}" aria-label="Delete habit: ${habit.name}" title="Delete">✕</button>
        </div>
        ${checkCells}
        <div class="cell streak-cell" aria-label="Streak: ${streak} days">
          <div class="streak-badge ${streakClass}">
            ${streakIcon ? `<span class="fire" aria-hidden="true">${streakIcon}</span>` : ''}
            <span>${streakLabel}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  const weekDayHeaders = WEEK_STARTS_MONDAY
    ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  container.innerHTML = `
    <div class="grid" role="grid" aria-label="Weekly habit grid">
      <!-- Header row -->
      <div class="col-header habit-col" role="columnheader">Habit</div>
      ${dayHeaders}
      <div class="col-header streak-col" role="columnheader">Streak</div>
      ${rows}
    </div>
    ${isFuture ? '<p class="future-notice">Future week — cells are locked ✦</p>' : ''}
  `;

  /* ── EVENTS ── */
  // Toggle checks
  container.querySelectorAll('.check-btn:not(.disabled)').forEach(btn => {
    btn.addEventListener('click', () => {
      const { habit: hId, date } = btn.dataset;
      if (!state.checks[date]) state.checks[date] = {};
      state.checks[date][hId] = !state.checks[date][hId];
      saveState();

      // Optimistic UI without full re-render
      const checked = state.checks[date][hId];
      btn.classList.toggle('checked', checked);
      btn.setAttribute('aria-pressed', String(checked));
      btn.setAttribute('aria-label', `${checked ? 'Uncheck' : 'Check'} ${state.habits.find(h=>h.id===hId)?.name} for ${date}`);

      // Pop animation
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
      btn.addEventListener('animationend', () => btn.classList.remove('pop'), { once: true });

      // Update streak badges only
      updateStreaks();
    });
  });

  // Delete habits
  container.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const hId = btn.dataset.habit;
      const habit = state.habits.find(h => h.id === hId);
      if (!habit) return;
      if (confirm(`Delete "${habit.name}"? This will remove all its check history.`)) {
        state.habits = state.habits.filter(h => h.id !== hId);
        // clean checks
        Object.keys(state.checks).forEach(date => {
          delete state.checks[date][hId];
        });
        saveState();
        render();
      }
    });
  });

  // Rename (click name → input)
  container.querySelectorAll('.habit-name-text').forEach(span => {
    const startEdit = () => {
      const row   = span.closest('.habit-row');
      const hId   = row.dataset.habitid;
      const habit = state.habits.find(h => h.id === hId);
      const inp   = document.createElement('input');
      inp.className = 'habit-name-input';
      inp.value = habit.name;
      inp.maxLength = 60;
      inp.setAttribute('aria-label', 'Rename habit');
      span.replaceWith(inp);
      inp.focus();
      inp.select();

      const commit = () => {
        const val = inp.value.trim();
        if (val && val !== habit.name) {
          habit.name = val;
          saveState();
          render();
        } else {
          render();
        }
      };

      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { inp.removeEventListener('blur', commit); render(); }
      });
    };

    span.addEventListener('click', startEdit);
    span.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startEdit(); } });
  });
}

function updateStreaks() {
  document.querySelectorAll('[data-habitid]').forEach(row => {
    const hId   = row.dataset.habitid;
    const badge = row.querySelector('.streak-badge');
    if (!badge) return;
    const streak = calcStreak(hId);
    const streakClass = streak >= 14 ? 'blazing' : streak >= 3 ? 'hot' : '';
    const streakIcon  = streak >= 14 ? '🔥' : streak >= 3 ? '✦' : '';
    const streakLabel = streak >= 3 ? `${streak}` : streak > 0 ? `${streak}d` : '–';
    badge.className   = `streak-badge ${streakClass}`;
    badge.innerHTML   = `${streakIcon ? `<span class="fire" aria-hidden="true">${streakIcon}</span>` : ''}<span>${streakLabel}</span>`;
  });
}

/* ── ADD HABIT ───────────────────────────────── */
function addHabit() {
  const input = document.getElementById('new-habit-input');
  const name  = input.value.trim();
  if (!name) { input.focus(); return; }

  const id = 'h_' + Date.now();
  state.habits.unshift({ id, name, createdAt: todayISO() });
  saveState();
  input.value = '';
  render(true);
  // scroll to top of grid
  document.getElementById('grid-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── WEEK NAV ────────────────────────────────── */
document.getElementById('btn-prev').addEventListener('click', () => {
  currentWeekStart.setDate(currentWeekStart.getDate() - 7);
  render();
});

document.getElementById('btn-next').addEventListener('click', () => {
  currentWeekStart.setDate(currentWeekStart.getDate() + 7);
  render();
});

document.getElementById('btn-today').addEventListener('click', () => {
  currentWeekStart = getMondayOf(new Date());
  render();
});

document.getElementById('btn-add').addEventListener('click', addHabit);

document.getElementById('new-habit-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addHabit();
});

/* ── INIT ────────────────────────────────────── */
loadState();
render();
</script>
</body>
</html>
<!-- end of habits app -->
